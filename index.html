<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wild Wonderlands</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Gowun+Dodum&family=Lexend:wght@400;500;600;700&display=swap"></head><body>
<style>
/* Layout: one reading column; four national park passport stamps (A-D) get stamped as each expert part is finished */
:root{
  --bg:#f1f3ec; --surface:#ffffff; --fg:#1f2a22; --muted:#5f6b62; --line:#d6dccf;
  --main:#2f6b4f; --main-soft:#e2eee6; --warm:#b4692a; --warm-soft:#f6eadc;
  --partA:#2b6c9a; --partB:#3d7a3a; --partC:#b4692a; --partD:#8e4a3a;
  --ok:#2f7d4f; --ok-soft:#e1f1e6; --no:#b54a3a; --no-soft:#f8e4e0; --on:#ffffff; --dirt:#b9c1b4;
  --font-en:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-ko:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --surface:#1d251f; --fg:#e6ece6; --muted:#a2b0a5; --line:#323d35;
  --main:#86c5a2; --main-soft:#213229; --warm:#e3a56d; --warm-soft:#3a2b1d;
  --partA:#8cbfe6; --partB:#97cf8f; --partC:#e3a56d; --partD:#e29a88;
  --ok:#7fcf9c; --ok-soft:#1f3a2a; --no:#f09a8a; --no-soft:#41241f; --on:#141a16; --dirt:#4a564d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --surface:#1d251f; --fg:#e6ece6; --muted:#a2b0a5; --line:#323d35;
  --main:#86c5a2; --main-soft:#213229; --warm:#e3a56d; --warm-soft:#3a2b1d;
  --partA:#8cbfe6; --partB:#97cf8f; --partC:#e3a56d; --partD:#e29a88;
  --ok:#7fcf9c; --ok-soft:#1f3a2a; --no:#f09a8a; --no-soft:#41241f; --on:#141a16; --dirt:#4a564d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ko);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.en{font-family:var(--font-en)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--font-en);font-weight:600;font-size:1.25rem;line-height:1.2}
.brand span{color:var(--muted);font-size:.9rem}
.homebtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.95rem;white-space:nowrap}
h1{font-size:1.4rem;line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:1.12rem;margin:0}
h2 small{color:var(--muted);font-weight:400;font-size:.88rem}
.note{color:var(--muted);font-size:.93rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.feet{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(8px,3.5vw,30px);padding-top:6px}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-en);font-weight:600}
.foot svg{width:60px;height:60px}
.foot span{font-size:.85rem}
.parts{display:grid;grid-template-columns:1fr;gap:12px}
.pcard{--c:var(--partA);text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);
  border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .tag{font-family:var(--font-en);font-weight:600;color:var(--c);font-size:.95rem}
.pcard .t{font-size:1.05rem}
.pcard .s{color:var(--muted);font-size:.88rem}
.pcard.done .s{color:var(--ok)}
.big{border:none;border-radius:14px;background:var(--main);color:var(--on);padding:16px;font-size:1.12rem;width:100%}
.big.warm{background:var(--warm)}
.big:disabled{opacity:.45;cursor:default}
.steps{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:5px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;font-size:.82rem;line-height:1.25;color:var(--muted)}
.step b{display:block;font-family:var(--font-en);font-size:.76rem}
.step[aria-current="true"]{border-color:var(--pc);color:var(--fg);background:var(--soft)}
.step.done b::after{content:" ✓";color:var(--ok)}
.parthead{display:flex;gap:10px;align-items:center}
.badge{font-family:var(--font-en);font-weight:600;color:var(--on);background:var(--pc);border-radius:8px;padding:2px 10px;font-size:.95rem;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem}
.chipbtn[aria-pressed="true"]{background:var(--soft);border-color:var(--pc)}
.who{font-family:var(--font-en);font-size:.8rem;font-weight:600;color:var(--pc);background:var(--soft);border-radius:6px;padding:2px 8px;justify-self:start;margin-top:8px}
.who.hdl{color:var(--main);background:var(--main-soft)}
.sent{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent .n{font-family:var(--font-en);color:var(--muted);font-size:.85rem;padding-top:3px}
.sent .e{font-family:var(--font-en);font-size:1.06rem;line-height:1.65;min-width:0}
.sent .e u{text-decoration-color:var(--pc);text-decoration-thickness:3px;text-underline-offset:4px}
.sent .k{grid-column:2;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 10px}
.sent .acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.wtag{display:inline-block;font-size:.85rem;background:var(--soft);color:var(--pc);border-radius:6px;padding:0 6px;margin-left:4px;font-family:var(--font-ko)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:.85rem}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:76px;padding:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.word .we{font-family:var(--font-en);font-weight:500;font-size:1.02rem}
.word .wk{color:var(--pc);font-size:.96rem}
.word.flipped{background:var(--soft);border-color:var(--pc)}
.q{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.q .qt{font-family:var(--font-en);font-weight:500}
.q .qk{color:var(--muted);font-size:.92rem;margin-top:-6px}
.q .line{font-family:var(--font-en);background:var(--bg);border-radius:8px;padding:8px 12px;line-height:2}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--pc);text-align:center;padding:0 6px;font-weight:600;color:var(--pc);line-height:1.5}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:1rem}
.opt.en{font-family:var(--font-en)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft);animation:shake .3s}
.opt:disabled{opacity:.35;cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{font-size:.95rem;min-height:1.4em;margin:0}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.pattern{border:2px solid var(--pc);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pattern .form{font-family:var(--font-en);font-weight:600;color:var(--pc);font-size:1.15rem}
.pattern .ex{font-family:var(--font-en)}
.pattern .exk{color:var(--muted);font-size:.93rem}
.built{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);font-family:var(--font-en)}
.built span{background:var(--soft);border:1px solid var(--pc);border-radius:8px;padding:2px 8px}
.bridge{background:var(--warm-soft);border-radius:12px;padding:12px 14px;font-size:.98rem}
.script{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:1.06rem;line-height:1.8}
.keycard{border:2px solid var(--pc);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.keycard .ke{font-family:var(--font-en);font-size:1.3rem;font-weight:600;color:var(--pc)}
.keycard .kx{font-family:var(--font-en);color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--main);flex:none}
.nav{display:flex;gap:10px}
.nav button{flex:1;border-radius:12px;padding:12px;font-size:1.02rem;border:1px solid var(--line);background:var(--surface)}
.nav .go{background:var(--pc);border-color:var(--pc);color:var(--on)}
.rbox{--c:var(--partA);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.rbox h3{margin:0;font-size:1.02rem}
.rbox h3 span{font-family:var(--font-en);color:var(--c);margin-right:6px}
.fill{display:flex;flex-direction:column;gap:6px}
.fill .p.en{font-family:var(--font-en)}
.vq{display:flex;flex-direction:column;gap:8px}
.vq .def{font-family:var(--font-en);font-size:1.15rem}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--main);transition:width .3s}
.poster{border:2px solid var(--main);border-radius:16px;padding:20px;background:var(--main-soft);display:flex;flex-direction:column;gap:10px}
.poster h3{margin:0;font-family:var(--font-en);color:var(--main);font-size:1.25rem}
.poster ol{margin:0;padding-left:1.3em;font-family:var(--font-en);font-size:1.08rem;line-height:1.8}
.poster .hl{color:var(--warm);font-weight:600}
.typed{width:100%;font:inherit;font-family:var(--font-en);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.done-hero{text-align:center;align-items:center}
.done-hero .hr{font-family:var(--font-en);font-weight:600;font-size:1.8rem;color:var(--main)}
table.gt{width:100%;border-collapse:collapse;font-size:.95rem}
table.gt th,table.gt td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.gt th{background:var(--bg);font-weight:400;color:var(--muted)}
table.gt td.en{font-family:var(--font-en)}
.tw{overflow-x:auto}
@media (max-width:480px){.step{font-size:.72rem}.step b{font-size:.64rem}}
.rq .qt{font-family:var(--font-en);font-weight:500}
.rq .opt{text-align:left}
.ptag{font-family:var(--font-en);font-size:.78rem;font-weight:600;color:var(--on);border-radius:6px;padding:1px 8px;justify-self:start;align-self:flex-start}
.why{font-size:.93rem;color:var(--muted)}
select.typed{width:auto}
@media (prefers-reduced-motion:reduce){.opt.wrong{animation:none}.meter i{transition:none}}

/* ---------- textbook-viewer theme, deeper colors ---------- */
:root{
  --bg:#e9ebf8; --surface:#ffffff; --fg:#17193a; --muted:#45486e; --line:#c4c8ea;
  --main:#3a3dab; --main-soft:#e1e2f8; --warm:#b4470c; --warm-soft:#fbe6d6;
  --partA:#1d4f9e; --partB:#1f6a35; --partC:#b4470c; --partD:#8e1f3c;
  --ok:#17703a; --ok-soft:#dcf2e3; --no:#b3231a; --no-soft:#fbe1dd; --on:#ffffff; --dirt:#a9adc9;
  --bar1:#3f43c0; --bar2:#7175e3; --star:#8b5cf6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121428; --surface:#1c1f3b; --fg:#eceefe; --muted:#b3b7dc; --line:#353a66;
  --main:#a5a8ff; --main-soft:#2a2e57; --warm:#ffa868; --warm-soft:#3d2a1d;
  --partA:#8fb6ff; --partB:#7fd79a; --partC:#ffa868; --partD:#ff8fae;
  --ok:#7fdc9d; --ok-soft:#1d3a2a; --no:#ff8f84; --no-soft:#46221f; --on:#121428; --dirt:#4c5180;
  --bar1:#2c2f8f; --bar2:#4b4fbf; --star:#b79cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121428; --surface:#1c1f3b; --fg:#eceefe; --muted:#b3b7dc; --line:#353a66;
  --main:#a5a8ff; --main-soft:#2a2e57; --warm:#ffa868; --warm-soft:#3d2a1d;
  --partA:#8fb6ff; --partB:#7fd79a; --partC:#ffa868; --partD:#ff8fae;
  --ok:#7fdc9d; --ok-soft:#1d3a2a; --no:#ff8f84; --no-soft:#46221f; --on:#121428; --dirt:#4c5180;
  --bar1:#2c2f8f; --bar2:#4b4fbf; --star:#b79cff; color-scheme:dark}
.wrap{max-width:900px}
.topbar{background:linear-gradient(90deg,var(--bar1),var(--bar2));color:#fff;border-radius:16px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:12px}
.topbar .ls{font-family:var(--font-en);font-weight:700;font-size:1.15rem;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 14px;white-space:nowrap}
.topbar .sub{flex:1;min-width:0;font-family:var(--font-en);font-weight:500;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .homebtn{background:#fff;color:#2c2f8f;border:none;font-weight:600}
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:auto}
.hero .tt{text-align:center;line-height:.95;margin-top:calc(-1 * clamp(2.6rem,10vw,5.2rem) * .62);position:relative;padding:0 12px}
.hero .w1{font-family:Anton,Impact,sans-serif;font-size:clamp(2.6rem,10vw,5.2rem);color:#fff;letter-spacing:.01em;text-shadow:0 3px 10px rgba(0,0,0,.35)}
.hero .w2{font-family:Anton,Impact,sans-serif;font-size:clamp(2.6rem,10vw,5.2rem);color:var(--main);letter-spacing:.01em;display:inline-block;border-bottom:4px solid var(--star);padding-bottom:2px}
.hero .cap{padding:10px 0 16px;text-align:center;font-family:var(--font-en);font-weight:600;color:var(--muted);font-size:.98rem}
h2{color:var(--main);font-weight:700}
.panel{border-color:var(--line);box-shadow:0 2px 0 rgba(40,44,140,.06)}
.parthead{background:var(--pc);color:var(--on);border-radius:16px;padding:14px 16px}
.parthead h1{color:var(--on)}
.parthead .badge{background:rgba(0,0,0,.25);color:#fff}
.steps{background:var(--main-soft);border-radius:14px;padding:5px}
.step{border:none;background:transparent;color:var(--muted);font-weight:500}
.step[aria-current="true"]{background:var(--surface);color:var(--main);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(90deg,var(--bar1),var(--bar2));border-radius:14px;padding:10px}
.pill{border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.98rem;color:#17193a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.pill.listen{background:#f3a3bf}.pill.ko{background:#a7e0b0}.pill.hide{background:#f8c49c}.pill.follow{background:#f5e08a}
.pill[aria-pressed="true"]{outline:3px solid #fff;outline-offset:1px}
.sent{padding:14px 0}
.sent .e{font-size:1.32rem;line-height:2.15;letter-spacing:.005em}
.sent .e u{text-decoration:none;background:linear-gradient(transparent 58%,#ffe066 58%);border-radius:2px}
:root[data-theme="dark"] .sent .e u{background:linear-gradient(transparent 58%,#8a6d00 58%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sent .e u{background:linear-gradient(transparent 58%,#8a6d00 58%)}}
.vw{position:relative;border-bottom:2px solid var(--star);cursor:pointer;white-space:nowrap}
.vw::before{content:"*";position:absolute;left:-.1em;top:-1.05em;color:var(--star);font-weight:800;font-size:1.05em;line-height:1}
.hidevw .vw{color:transparent;background:color-mix(in srgb,var(--star) 22%,var(--surface));border-radius:5px}
.sent.now{background:color-mix(in srgb,#ffe066 30%,var(--surface));border-radius:10px}
.who.hdl{font-size:.95rem;color:var(--main);background:transparent;padding:0;font-weight:700}
.opt{border-width:2px;font-weight:500}
.big{font-weight:700}

.mic{background:#ffe7ef;border-color:#e86a96;color:#8e1f4d;font-weight:700}
.mic.on{background:#e8336f;color:#fff;border-color:#e8336f;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tts{background:#e3e9ff;border-color:#5a64d8;color:#2c2f8f;font-weight:700}
.mres{grid-column:1/-1;margin-top:6px;background:var(--main-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.98rem}
.mres .tw{font-family:var(--font-en);font-size:1.08rem;line-height:1.7}
.mres .g{color:var(--ok);font-weight:700}.mres .r{color:var(--no);font-weight:700;text-decoration:underline wavy}
.mres .sc{font-weight:700;color:var(--main)}
.mres audio{width:100%;max-width:340px;height:36px}
.speed{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap}
.speed[aria-pressed="true"]{background:#fff;color:#2c2f8f}
.pill.badge{background:#fff;color:#2c2f8f;cursor:default}
.word{padding:8px 8px 10px;gap:6px}
.word .wflip{background:none;border:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--fg);width:100%}
.word .we{font-size:1.12rem;font-weight:600}
.word .acts{justify-content:center}
.word .mini{padding:3px 9px;font-size:.85rem}
.word .mres{font-size:.85rem;padding:6px 8px}
.word .mres .tw{font-size:.95rem}
.words{align-items:start}
.word .acts{flex-wrap:wrap}
.word .mini{white-space:nowrap;padding:3px 7px}
.words{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.word .mres .note,.word .mres > span:last-child{display:none}
.word .mres{width:100%;text-align:center}
.fill .acts,.q .acts{margin-top:4px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2c2f8f;color:#fff;border-radius:999px;padding:10px 20px;font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:9;max-width:calc(100% - 32px)}
#toast b{font-family:var(--font-en)}
@media (max-width:480px){.sent .e{font-size:1.15rem;line-height:2.05}}
</style>

function stopFollow(){ FOLLOW.on = false; clearTimeout(FOLLOW.t); if(canSpeak) speechSynthesis.cancel(); app.querySelectorAll('.sent.now').forEach(x => x.classList.remove('now')); }

function stepFollow(){
  if(!FOLLOW.on) return;

  if(FOLLOW.i >= D.sents.length){ FOLLOW.on = false; draw(); toast('따라 읽기 끝! 잘했어요.'); return; }

  if(el){ el.classList.add('now'); el.scrollIntoView({block:'center', behavior:'smooth'}); }

  const v = speechSynthesis.getVoices().find(v => /en[-_]US/i.test(v.lang)); if(v) u.voice = v;
  const words = text.split(/\s+/).length;
  u.onend = () => { if(!FOLLOW.on) return; FOLLOW.t = setTimeout(() => { FOLLOW.i++; stepFollow(); }, 900 + words * 420); };

let toastT = null;
function toast(html){ const t = document.getElementById('toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
const FIRST = {};
function wordRe(w){
  let base = w.replace(/ \(.*\)$/,'');
  if(!/ /.test(base) && base.length > 4 && /e$/.test(base)) base = base.slice(0,-1);
  base = base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('\\b(' + base + '[a-z]*)', 'i');
}
function markWords(p, html, si){
  const W = PARTS[p].words;
  if(!FIRST[p]){ FIRST[p] = W.map(w => { const re = wordRe(w[0]); return PARTS[p].sents.findIndex(s => re.test(s[1].replace(/<[^>]+>/g,''))); }); }
  let out = html;
  W.forEach((w, wi) => {
    if(FIRST[p][wi] !== si) return;
    const re = wordRe(w[0]);
    const parts = out.split(/(<[^>]+>)/); let done = false;
    out = parts.map(seg => { if(done || seg.startsWith('<')) return seg; if(re.test(seg)){ done = true; return seg.replace(re, `<span class="vw" data-w="${wi}">$1</span>`); } return seg; }).join('');
  });
  return out;
}

function sayIt(html, rate){
  if(!canSpeak) return;
  const t = String(html).replace(/<[^>]+>/g,'');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = (rate || 0.8) * RATE;
  const v = speechSynthesis.getVoices().find(v => /en[-_]US/i.test(v.lang)); if(v) u.voice = v;
  speechSynthesis.speak(u);
}

function wordTags(p, html){
  // show a small Korean hint after key vocabulary that appears in the sentence (first 2 matches)
  const plain = html.replace(/<[^>]+>/g,'').toLowerCase();
  const hits = PARTS[p].words.filter(w => { const base = w[0].replace(/ \(.*\)$/,'').toLowerCase(); return plain.includes(base); }).slice(0,2);
  return hits.map(w => `<span class="wtag">${esc(w[0].replace(/ \(.*\)$/,''))} ${esc(w[1])}</span>`).join('');
}
function expertDone(p,i){
  const st = prog(p), D = PARTS[p];
  if(i===0) return st.words.size === D.words.length && st.wq.done;
  if(i===1) return !!st.read;
  if(i===2) return D.grammar.build.every((b,k) => (st.build[p+'b'+k]||[]).length === b.t.length) && D.grammar.choose.every((c,k) => st.choose[p+'c'+k]);
  if(i===3) return D.qs.every((q,qi) => q.blanks.every((b,bi) => st.q[qi+'-'+bi]));
  return !!S.done[p];
}
function wordQuizHTML(p){
  const st = prog(p), W = PARTS[p].words;
  if(!st.wq.list) st.wq.list = mix(W.map((w,i)=>i)).slice(0,5);
  if(st.wq.done) return `<p class="fb ok">퀴즈 완료! 5문제 중 ${st.wq.score||0}개를 한 번에 맞혔어요.</p><button class="mini" id="wqAgain">다시 풀기</button>`;
  const idx = st.wq.list[st.wq.i], w = W[idx];
  const others = mix(W.map((x,i)=>i).filter(i => i!==idx)).slice(0,2);
  const opts = mix([idx, ...others]);
  return `<div class="meter"><i style="width:${st.wq.i/5*100}%"></i></div>
    <div class="vq"><span class="note">${st.wq.i+1} / 5</span><span style="font-size:1.25rem">${esc(w[1])}</span>
    <div class="opts">${opts.map(i => `<button class="opt en" data-wq="${i}">${esc(W[i][0])}</button>`).join('')}</div><p class="fb" id="fbwq"></p></div>`;
}
function bindWordQuiz(p){
  const st = prog(p);
  const again = document.getElementById('wqAgain'); if(again) again.onclick = () => { st.wq = {i:0, list:null, done:false}; draw(); };
  let missed = false;
  app.querySelectorAll('[data-wq]').forEach(b => b.onclick = () => {
    const idx = st.wq.list[st.wq.i];
    if(+b.dataset.wq === idx){
      b.classList.add('right'); if(!missed) st.wq.score = (st.wq.score||0) + 1;
      sayIt(PARTS[p].words[idx][0], 0.75);
      setTimeout(() => { st.wq.i++; if(st.wq.i >= 5) st.wq.done = true; draw(); }, 420);
    } else { missed = true; shake(b); const f = document.getElementById('fbwq'); f.className='fb no'; f.textContent='다시! 위의 단어 카드를 다시 봐도 돼요.'; }
  });
}
function missionHTML(p,q,qi){
  const st = prog(p); let bi = 0;
  const line = esc(q.line).replace(/___/g, () => { const v = st.q[qi+'-'+bi]; const b = q.blanks[bi]; bi++; return `<span class="blank ${v?'ok':''}">${v?esc(b.a):'?'}</span>`; });
  const cur = q.blanks.findIndex((b,i) => !st.q[qi+'-'+i]);
  return `<div class="q"><span class="qt">Q${qi+1}. ${esc(q.q)} ${ttsBtn(q.q)}</span><span class="qk">${esc(q.k)}</span>
    <div class="line">${line}</div>
    ${cur === -1 ? `<p class="fb ok">정답이에요! 문장을 듣고 소리 내어 읽어 보세요. ${(() => { let k = 0; const full = q.line.replace(/___/g, () => q.blanks[k++].a).replace(/\s+([.?!])/g,'$1'); return ttsBtn(full) + ' ' + micBtn(full); })()}</p>` : `<div class="opts">${q.blanks[cur].o.map(o => `<button class="opt en" data-q="${qi}" data-b="${cur}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><p class="fb" id="fbq${qi}"></p>`}
  </div>`;
}
function bindMission(p){
  const D = PARTS[p], st = prog(p);
  app.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const qi = +b.dataset.q, bi = +b.dataset.b, ans = D.qs[qi].blanks[bi].a;
    if(b.dataset.v === ans){ b.classList.add('right'); st.q[qi+'-'+bi] = true; S.stars++; saveS(); setTimeout(draw, 320); }
    else { shake(b); const f = document.getElementById('fbq'+qi); f.className='fb no';
      f.textContent = (ans === 'take') ? '힌트: make + 사람 다음에는 to 없이 동사원형!' : '본문을 한 번 더 읽어 볼까요?'; }
  });
}

    const blank = `<span class="blank ${v?'ok':''}">${v?esc(it.a):'?'}</span>`;
    h += `<div class="fill"><span class="p ${it.en?'en':''}">${esc(it.pre).replace('(  )', blank)}</span>
      ${v ? (it.en ? `<div class="acts">${ttsBtn(it.pre.replace('(  )', it.a))}${micBtn(it.pre.replace('(  )', it.a))}</div>` : '') : `<div class="opts">${mix(it.o).map(o => `<button class="opt ${it.en?'en':''}" data-rep="${it.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}</div>`;
  });
  const e = H.emo[r.p];
  h += `<div class="fill"><span>${esc(r.emoq)}: <span class="blank ${e?'ok':''}">${e?esc(e):'?'}</span></span>
    ${e ? '' : `<div class="opts">${DATA.emotions.map(x => `<button class="opt" data-emo="${r.p}" data-v="${x[0]}"><span class="en">${x[0]}</span> (${x[1]})</button>`).join('')}</div>`}</div>`;
  return h + '</div>';
}
function bindReport(){
  const items = {}; DATA.report.forEach(r => r.items.forEach(it => items[it.id] = it));
  const emo = {}; DATA.report.forEach(r => emo[r.p] = r.emo);
  app.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => {
    const it = items[b.dataset.rep];
    if(b.dataset.v === it.a){ b.classList.add('right'); H.rep[it.id] = true; S.stars++; saveS(); saveH(); setTimeout(draw, 300); }
    else shake(b);
  });
  app.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => {
    if(b.dataset.v === emo[b.dataset.emo]){ b.classList.add('right'); H.emo[b.dataset.emo] = b.dataset.v; S.stars++; saveS(); saveH(); setTimeout(draw, 300); }
    else shake(b);
  });
}
function vocabHTML(){
  const V = DATA.vocabq, vs = H.vocab;
  if(!vs.order) { vs.order = mix(V.map((v,i)=>i)); saveH(); }
  if(vs.done) return `<div class="done-hero" style="display:flex;flex-direction:column;gap:6px"><span class="hr" style="font-size:1.4rem">${vs.score} / ${V.length}</span>
    <span>한 번에 맞힌 단어 수예요.</span><button class="mini" id="vAgain">다시 풀기</button></div>`;
  const idx = vs.order[vs.i], v = V[idx];
  const others = mix(V.map((x,i)=>i).filter(i => i!==idx)).slice(0,3);
  return `<div class="meter"><i style="width:${vs.i/V.length*100}%"></i></div>
    <div class="vq"><span class="note">${vs.i+1} / ${V.length}</span><span class="def">${esc(v[0])} ${ttsBtn(v[0])}</span><span style="color:var(--pc)">${esc(v[1])}</span>
    <div class="opts">${mix([idx, ...others]).map(i => `<button class="opt en" data-voc="${i}">${esc(V[i][2])}</button>`).join('')}</div><p class="fb" id="fbv"></p></div>`;
}
function bindVocab(){
  const vs = H.vocab, V = DATA.vocabq; let missed = false;
  const ag = document.getElementById('vAgain'); if(ag) ag.onclick = () => { H.vocab = {i:0, score:0, done:false, order:null}; saveH(); draw(); };
  app.querySelectorAll('[data-voc]').forEach(b => b.onclick = () => {
    const idx = vs.order[vs.i];
    if(+b.dataset.voc === idx){ b.classList.add('right'); if(!missed) vs.score++; sayIt(V[idx][2], 0.75);
      setTimeout(() => { vs.i++; if(vs.i >= V.length) vs.done = true; saveH(); draw(); }, 420); }
    else { missed = true; shake(b); const f = document.getElementById('fbv'); f.className='fb no'; f.textContent='다시 골라 봐요. 우리말 뜻이 힌트예요.'; }
  });
}
function readHTML(q,i){
  const ok = H.read[i];
  return `<div class="q rq"><span class="ptag" style="background:var(${PCOLOR[q.p]||'--main'})">${q.p === '전체' ? '전체' : 'Part ' + q.p}</span>
    <span class="qt">${i+1}. ${esc(q.q)} ${ttsBtn(q.q)}</span><span class="qk">${esc(q.k)}</span>
    ${ok ? `<p class="fb ok">정답: <span class="en">${esc(q.a)}</span></p>${q.why?`<p class="why">${esc(q.why)}</p>`:''}`
      : `<div class="opts" style="flex-direction:column">${mix(q.o).map(o => `<button class="opt en" data-rq="${i}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><p class="fb" id="fbr${i}"></p>`}
  </div>`;
}
function bindRead(){
  app.querySelectorAll('[data-rq]').forEach(b => b.onclick = () => {
    const i = +b.dataset.rq, q = DATA.readq[i];
    if(b.dataset.v === q.a){ b.classList.add('right'); H.read[i] = true; S.stars++; saveS(); saveH(); setTimeout(draw, 320); }
    else { H.readMiss[i] = true; saveH(); shake(b); const f = document.getElementById('fbr'+i); f.className = 'fb no';
      f.textContent = q.p === '전체' ? '네 파트의 공통점을 생각해 봐요.' : `Part ${q.p} 전문가에게 물어보고 다시 골라요.`; }
  });
}
draw();
</script>
